<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统错误 - 500</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .error-container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #ff4d4f;
            font-size: 72px;
            margin: 0;
        }
        p {
            color: #666;
            margin: 20px 0;
        }
        a {
            color: #1890ff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>500</h1>
        <p>服务器内部错误，请稍后重试</p>
        <p><a href="javascript:history.back()">返回上一页</a> 或 <a href="/admin/dashboard">返回仪表盘</a></p>
    </div>
</body>
</html>
