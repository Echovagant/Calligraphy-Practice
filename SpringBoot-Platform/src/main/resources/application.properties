# 应用程序基本信息
app.name=Calligraphy Platform Application
app.version=1.0.0
app.description=A calligraphy practice platform

# 服务器配置
server.port=8083
# 移除context-path前缀，使管理界面可以直接通过/admin访问
server.servlet.context-path=

# 数据库配置 (使用MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/calligraphy_practice?useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

# 连接池优化配置
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# JPA配置
# 设置为update模式，让Hibernate自动更新数据库模式
spring.jpa.hibernate.ddl-auto=update
# 生产环境关闭SQL日志
spring.jpa.show-sql=false
# 生产环境关闭SQL格式化
spring.jpa.properties.hibernate.format_sql=false
# 显式禁用open-in-view，避免在视图渲染期间执行数据库查询
spring.jpa.open-in-view=false

# 数据库结构由 JPA ddl-auto=update 与 db/ 下的手工脚本维护。
# 历史上这里用的是 mode=always + recreate_schema.sql，每次启动都会 DROP
# users/works/comments/practice_records 四张表，导致数据被清空。
# 建表脚本保留在 src/main/resources/recreate_schema.sql 下供参考，但不再自动执行。
spring.sql.init.mode=never

# 允许循环依赖（临时解决方案）
spring.main.allow-circular-references=true

# JWT配置
# 使用更强的密钥增强安全性
jwt.secret=calligraphy-platform-jwt-secret-key-2024-secure-string-with-enough-length
# 缩短为1小时，提高安全性
jwt.expiration=3600000
# 30天的刷新令牌
jwt.refreshExpiration=2592000000
jwt.issuer=calligraphy-platform
jwt.audience=calligraphy-app
jwt.tokenPrefix=Bearer 
jwt.authHeaderName=Authorization

# Redis配置（phpstudy_pro）
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=65s
spring.data.redis.password=
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=2s

# CORS配置 - 使用Spring Boot 3.x推荐的配置方式
# 注意：为了安全起见，生产环境应该指定具体的域名而不是使用通配符
# 这些配置将通过Java配置类实现，而不是在properties文件中配置
# spring.mvc.cors.allowed-origins=*
# spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
# spring.mvc.cors.allowed-headers=*

# 日志配置
# 调整日志级别，减少不必要的日志输出
logging.level.root=INFO
logging.level.com.calligraphy.platform=INFO
logging.level.com.calligraphy.platform.service=INFO
logging.level.com.calligraphy.platform.security=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.filter=INFO
logging.level.org.springframework.web.servlet=INFO
logging.level.org.hibernate=INFO

# 启用彩色输出
spring.output.ansi.enabled=ALWAYS

# 自定义日志格式（包含彩色输出和请求ID）
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %highlight(%-5level) %cyan(%logger{36}) - %msg%n
# 日志文件配置
logging.file.name=app.log
logging.file.path=.
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
# 确保日志使用UTF-8编码
logging.charset.console=UTF-8
logging.charset.file=UTF-8
spring.http.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true

# 邮件配置
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=your-email@example.com
spring.mail.password=your-email-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# 上传文件
# file.upload-dir 是 FileUploadServiceImpl 写文件用的根目录，
# WebConfig 的静态资源映射（/api/files/**）读的是同一个属性 —— 两边必须一致。
# 相对路径按**进程工作目录**解析，因此要从 SpringBoot-Platform/ 目录启动应用，
# 否则文件会落到别处。
#
# 允许的上传类型**不在这里配**：它读的是数据库 system_config 表的
# work.upload.allowed.types，取不到时回落到代码里的默认列表
# （jpg/jpeg/png/gif/pdf）。不要在这里再加一份，避免两个真相源。
file.upload-dir=uploads
file.max-size=10485760