<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 登录</title>
    <!-- 引入Layui -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.10/dist/css/layui.css">
    <style>
        body {
            background-color: #f2f2f2;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }
        .login-title {
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
            color: #333;
        }
        .login-form {
            margin-top: 20px;
        }
        .layui-form-item {
            margin-bottom: 20px;
        }
        .layui-form-item:last-child {
            margin-bottom: 0;
        }
        .error-message {
            color: #ff4d4f;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        .error-shown {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2 class="login-title">管理后台</h2>
        <form id="loginForm" class="layui-form login-form">
            <div class="layui-form-item">
                <label class="layui-form-label">用户名</label>
                <div class="layui-input-block">
                    <input type="text" id="username" name="username" required lay-verify="required" placeholder="请输入用户名" autocomplete="off" class="layui-input">
                </div>
            </div>
            
            <div class="layui-form-item">
                <label class="layui-form-label">密码</label>
                <div class="layui-input-block">
                    <input type="password" id="password" name="password" required lay-verify="required" placeholder="请输入密码" autocomplete="off" class="layui-input">
                </div>
            </div>
            
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button type="button" id="loginSubmit" class="layui-btn layui-btn-fluid">登录</button>
                </div>
            </div>
            
            <div id="errorMsg" class="error-message" th:classappend="${param.error} ? 'error-shown'">
                <span th:text="${param.error} ? ${param.error} : '用户名或密码错误，请重试'"></span>
            </div>
        </form>
    </div>

    <script>
        // 简化的原生JavaScript实现
        window.onload = function() {
            console.log('页面加载完成，开始初始化登录功能...');
            
            // 使用简单直接的ID选择器
            const loginForm = document.getElementById('loginForm');
            const submitBtn = document.getElementById('loginSubmit');
            const errorMsg = document.getElementById('errorMsg');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            
            // 打印元素状态，便于调试
            console.log('元素获取状态:');
            console.log('- loginForm:', !!loginForm);
            console.log('- submitBtn:', !!submitBtn);
            console.log('- errorMsg:', !!errorMsg);
            console.log('- usernameInput:', !!usernameInput);
            console.log('- passwordInput:', !!passwordInput);
            
            // 确保所有元素都存在
            if (!loginForm || !submitBtn || !errorMsg || !usernameInput || !passwordInput) {
                console.error('无法找到所有必要的DOM元素');
                return;
            }
            
            // 确保按钮是启用状态
            submitBtn.disabled = false;
            console.log('登录按钮已启用');
            
            // 登录处理函数
            function handleLogin() {
                console.log('处理登录请求...');
                
                // 获取并验证输入值
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();
                
                if (!username || !password) {
                    console.log('用户名或密码为空');
                    errorMsg.textContent = '用户名和密码不能为空';
                    errorMsg.style.display = 'block';
                    return;
                }
                
                // 禁用按钮防止重复提交
                submitBtn.disabled = true;
                errorMsg.style.display = 'none';
                
                // 构建登录数据
                const loginData = {
                    username: username,
                    password: password
                };
                
                console.log('准备发送登录请求到 /auth/login');
                console.log('登录数据:', loginData);
                
                // 发送登录请求
                fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(loginData),
                    credentials: 'include'
                })
                .then(response => {
                    console.log('收到响应，状态码:', response.status);
                    return response.json().catch(err => {
                        console.error('解析响应失败:', err);
                        throw new Error('服务器返回非JSON响应');
                    });
                })
                .then(data => {
                    console.log('响应数据:', data);
                    
                    if (data && data.accessToken) {
                        // 登录成功
                        console.log('登录成功，保存token并跳转');
                        localStorage.setItem('token', data.accessToken);
                        if (data.refreshToken) {
                            localStorage.setItem('refreshToken', data.refreshToken);
                        }
                        
                        // 创建一个XHR请求，添加Authorization头
                        const xhr = new XMLHttpRequest();
                        xhr.open('GET', '/admin/dashboard', true);
                        xhr.setRequestHeader('Authorization', 'Bearer ' + data.accessToken);
                        xhr.withCredentials = true;
                        xhr.onreadystatechange = function() {
                            if (xhr.readyState === 4) {
                                // 无论请求结果如何，都执行页面跳转
                                // 这样浏览器会再次请求页面，但会使用存储的Cookie或Session
                                window.location.href = '/admin/dashboard';
                            }
                        };
                        xhr.send();
                    } else {
                        throw new Error(data.message || '登录失败');
                    }
                })
                .catch(error => {
                    console.error('登录失败:', error);
                    errorMsg.textContent = error.message || '登录失败，请重试';
                    errorMsg.style.display = 'block';
                })
                .finally(() => {
                    // 无论如何都启用按钮
                    submitBtn.disabled = false;
                    console.log('登录按钮已启用');
                });
            }
            
            // 添加按钮点击事件
            submitBtn.addEventListener('click', handleLogin);
            console.log('已添加点击事件监听器');
            
            // 添加表单提交事件
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                console.log('表单提交事件触发');
                handleLogin();
            });
            
            // 添加回车键支持
            loginForm.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    console.log('回车键触发登录');
                    handleLogin();
                }
            });
        };
    </script>
</body>
</html>
