<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加用户 - 管理后台</title>
    <!-- 引入Layui -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.10/dist/css/layui.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f0f2f5;
        }
        .form-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }
        .form-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e6e6e6;
        }
        .required-mark {
            color: #ff0000;
        }
        .layui-form-item {
            margin-bottom: 20px;
        }
        .layui-form-label {
            width: 100px;
        }
        .layui-input-block {
            margin-left: 130px;
        }
        .form-actions {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e6e6e6;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-title">添加用户</div>
        
        <form class="layui-form" id="userForm">
            <div class="layui-form-item">
                <label class="layui-form-label">用户名 <span class="required-mark;">*</span></label>
                <div class="layui-input-block">
                    <input type="text" name="username" lay-verify="required|username" placeholder="请输入用户名" 
                           autocomplete="off" class="layui-input" maxlength="20">
                    <div class="layui-word-aux">用户名长度为3-20个字符</div>
                </div>
            </div>
            
            <div class="layui-form-item">
                <label class="layui-form-label">密码 <span class="required-mark">*</span></label>
                <div class="layui-input-block">
                    <input type="password" name="password" lay-verify="required|password" placeholder="请输入密码" 
                           autocomplete="off" class="layui-input" maxlength="30">
                    <div class="layui-word-aux">密码长度为6-30个字符</div>
                </div>
            </div>
            
            <div class="layui-form-item">
                <label class="layui-form-label">确认密码 <span class="required-mark">*</span></label>
                <div class="layui-input-block">
                    <input type="password" name="confirmPassword" lay-verify="required|confirmPassword" 
                           placeholder="请再次输入密码" autocomplete="off" class="layui-input" maxlength="30">
                </div>
            </div>
            
            <div class="layui-form-item">
                <label class="layui-form-label">邮箱 <span class="required-mark">*</span></label>
                <div class="layui-input-block">
                    <input type="text" name="email" lay-verify="required|email" placeholder="请输入邮箱" 
                           autocomplete="off" class="layui-input">
                </div>
            </div>
            
            <div class="layui-form-item">
                <label class="layui-form-label">姓名 <span class="required-mark;">*</span></label>
                <div class="layui-input-block">
                    <input type="text" name="fullName" lay-verify="required" placeholder="请输入姓名" 
                           autocomplete="off" class="layui-input" maxlength="50">
                </div>
            </div>
            
            <div class="layui-form-item">
                <label class="layui-form-label">用户角色</label>
                <div class="layui-input-block">
                    <select name="role" lay-verify="required" title="用户角色">
                        <option value="USER">普通用户</option>
                        <option value="ADMIN">管理员</option>
                    </select>
                </div>
            </div>
            
            <div class="layui-form-item">
                <label class="layui-form-label">用户状态</label>
                <div class="layui-input-block">
                    <input type="checkbox" name="active" lay-skin="switch" lay-text="启用|禁用" title="用户状态" checked>
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="layui-btn layui-btn-normal" lay-submit lay-filter="submitBtn">保存</button>
                <button type="button" class="layui-btn layui-btn-primary" id="cancelBtn">取消</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/layui@2.9.10/dist/layui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script>
        layui.use(['form', 'layer'], function() {
            var form = layui.form;
            var layer = layui.layer;
            
            // 自定义验证规则
            form.verify({
                username: function(value) {
                    if (value.length < 3 || value.length > 20) {
                        return '用户名长度必须在3到20个字符之间';
                    }
                    // 检查用户名是否已存在
                    let result = false;
                    $.ajax({
                        url: '/api/users/check-username',
                        type: 'POST',
                        data: { username: value },
                        async: false,
                        success: function(res) {
                            if (res.exists) {
                                result = '该用户名已存在';
                            }
                        }
                    });
                    return result;
                },
                password: function(value) {
                    if (value.length < 6 || value.length > 30) {
                        return '密码长度必须在6到30个字符之间';
                    }
                },
                confirmPassword: function(value) {
                    var password = $('input[name="password"]').val();
                    if (value !== password) {
                        return '两次输入的密码不一致';
                    }
                }
            });
            
            // 监听表单提交
            form.on('submit(submitBtn)', function(data) {
                // 构建请求数据
                var userData = {
                    username: data.field.username,
                    password: data.field.password,
                    email: data.field.email,
                    fullName: data.field.fullName,
                    role: data.field.role,
                    active: data.field.active === 'on'
                };
                
                // 发送添加用户请求
                $.ajax({
                    url: '/api/users',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(userData),
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    },
                    success: function() {
                        layer.msg('添加用户成功', { icon: 1 });
                        // 关闭当前弹窗并刷新父页面
                        setTimeout(function() {
                            var index = parent.layer.getFrameIndex(window.name);
                            parent.layer.close(index);
                            parent.location.reload();
                        }, 1500);
                    },
                    error: function(xhr) {
                        var errorMsg = xhr.responseJSON?.message || '添加用户失败';
                        layer.msg(errorMsg, { icon: 2 });
                    }
                });
                return false; // 阻止表单默认提交
            });
            
            // 取消按钮事件
            $('#cancelBtn').click(function() {
                var index = parent.layer.getFrameIndex(window.name);
                parent.layer.close(index);
            });
        });
    </script>
</body>
</html>
