# 测试专用配置。
#
# jwt.secret 是**测试密钥**，不是秘密 —— 它只签发只存在于测试库里的令牌，
# 即使泄露也换不到任何东西。真正的密钥走环境变量（见 run-local.ps1）。
#
# 数据库密码不在这里：它同样走环境变量 DB_PASSWORD。
#
# 注意：不要在这里写 spring.profiles.active —— profile 专属文件里禁止声明它
# （会抛 InvalidConfigDataPropertyException）。profile 由测试类上的
# @ActiveProfiles("test") 激活。
jwt.secret=test-only-jwt-signing-key-for-automated-tests-0123456789abcdef

spring.datasource.password=${DB_PASSWORD:}
