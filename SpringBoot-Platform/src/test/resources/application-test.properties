# 测试专用配置。
#
# jwt.secret 是**测试密钥**，不是秘密 —— 它只签发只存在于测试库里的令牌，
# 即使泄露也换不到任何东西。真正的密钥走环境变量（见 run-local.ps1）。
#
# 数据库密码不在这里：它同样走环境变量 DB_PASSWORD。
#
# 注意：不要在这里写 spring.profiles.active —— profile 专属文件里禁止声明它
# （会抛 InvalidConfigDataPropertyException）。profile 由测试类上的
# @ActiveProfiles("test") 激活。
jwt.secret=test-only-jwt-signing-key-for-automated-tests-0123456789abcdef

spring.datasource.password=${DB_PASSWORD:}

# 测试跑在**独立库**上，不碰开发库。
#
# 为什么分开：测试会造数据也会清数据。混在开发库里有两个后果 ——
# 一是测试残留会污染演示数据，二是库里已有的待审作品会让
# 「队列清空后应返回空数组」这类断言时灵时不灵。
# createDatabaseIfNotExist 让第一次跑测试不用手工建库。
spring.datasource.url=jdbc:mysql://localhost:3306/calligraphy_practice_test?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false&allowPublicKeyRetrieval=true

# 表结构交给 ddl-auto=update 建，播种只喂 3 个精选字帖。
# defer 让播种脚本等表建好之后再跑（否则脚本先跑会找不到表）。
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:seed/seed-copybooks.sql
spring.jpa.defer-datasource-initialization=true

# 打开 Hibernate 统计：性能用例靠它断言「有没有把实体整批拉进内存」
# （实体加载数 / 实体抓取数）。只影响测试，不影响生产配置。
spring.jpa.properties.hibernate.generate_statistics=true
