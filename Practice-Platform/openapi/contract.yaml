components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: 参数非法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: 未认证或令牌失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 越权
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 冲突（用户名重复等）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: 业务校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Locked:
      description: 账号被锁定
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: 请求过于频繁
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      description: 失败响应体（design doc §3.1 规则三）。
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 错误码，如 AUTH_FAILED、USER_EXISTS、VALIDATION_ERROR
        message:
          type: string
          description: 可读错误消息
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
        nickname:
          type: string
        phone:
          type: string
        deviceInfo:
          type: string
        ipAddress:
          type: string
        verificationCode:
          type: string
    RegisterResponse:
      type: object
      description: 注册结果。与登录同样是「令牌 + user 对象」。
      required:
        - accessToken
        - refreshToken
        - user
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
          description: 令牌有效期，单位**毫秒**（取自 `jwt.expiration`）
        user:
          $ref: '#/components/schemas/AuthUser'
        verificationRequired:
          type: boolean
        message:
          type: string
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
        twoFactorCode:
          type: string
        rememberMe:
          type: boolean
        deviceInfo:
          type: string
        ipAddress:
          type: string
    LoginResponse:
      type: object
      description: 登录结果。`user` 是嵌套的用户对象（不是 data 信封），前端直接读 `response.user.username`。
      required:
        - accessToken
        - refreshToken
        - user
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
          description: 令牌有效期，单位**毫秒**（取自 `jwt.expiration`）
        user:
          $ref: '#/components/schemas/AuthUser'
    AuthUser:
      type: object
      description: >
        用户资料，只暴露前端真正用到的字段。前端用户与管理员都用这个 schema，
        靠 `role` 区分（USER / ADMIN / SUPER_ADMIN）—— 后端两者同在 `users` 表。
      required:
        - id
        - username
        - role
      properties:
        id:
          type: string
        username:
          type: string
        nickname:
          type: string
        email:
          type: string
        avatar:
          type: string
        role:
          type: string
          description: USER / ADMIN / SUPER_ADMIN
    AdminLoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    TokenPair:
      type: object
      description: 刷新令牌返回的新令牌对。
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
          description: 令牌有效期，单位**毫秒**（取自 `jwt.expiration`）
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
        deviceInfo:
          type: string
        ipAddress:
          type: string
    VerificationCodeRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
    VerificationCodeSent:
      type: object
      description: 验证码已发送。**不要**在响应里回传验证码本身。
      properties:
        message:
          type: string
    FrontendUserUpdate:
      type: object
      description: >
        更新**当前**用户的资料 —— 用户 id 从令牌里取，不在请求体里传。
        （后端 `FrontendUserUpdateDto` 上有个 `userId` 字段，契约不暴露它。）
      required:
        - nickname
        - email
      properties:
        nickname:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
        phone:
          type: string
        avatar:
          type: string
        gender:
          type: string
        birthday:
          type: string
          format: date
        bio:
          type: string
        status:
          type: string
    FrontendUser:
      type: object
      description: 对应后端 `FrontendUserDto`。
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        nickname:
          type: string
        avatar:
          type: string
        phone:
          type: string
        bio:
          type: string
        preferences:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - SUSPENDED
            - PENDING_VERIFICATION
        isVerified:
          type: boolean
        isTwoFactorEnabled:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
        lastLoginIp:
          type: string
        failedLoginAttempts:
          type: integer
        lockedUntil:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        practiceCount:
          type: integer
          format: int64
        workCount:
          type: integer
          format: int64
        commentCount:
          type: integer
          format: int64
        totalLikesReceived:
          type: integer
          format: int64
        totalViewsReceived:
          type: integer
          format: int64
        roles:
          type: array
          items:
            type: string
        lastActivityAt:
          type: string
          format: date-time
        lastActivityType:
          type: string
    BackendUser:
      type: object
      description: 对应后端 `BackendUserDto`。
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        nickname:
          type: string
        avatar:
          type: string
        phone:
          type: string
        department:
          type: string
        position:
          type: string
        bio:
          type: string
        role:
          type: string
        isVerified:
          type: boolean
        isTwoFactorEnabled:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
        lastLoginIp:
          type: string
        failedLoginAttempts:
          type: integer
        lockedUntil:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        reviewCount:
          type: integer
          format: int64
        approvedCount:
          type: integer
          format: int64
        rejectedCount:
          type: integer
          format: int64
        revisionRequestedCount:
          type: integer
          format: int64
        permissions:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string
        lastActivityAt:
          type: string
          format: date-time
        lastActivityType:
          type: string
    PasswordChangeRequest:
      type: object
      description: >
        已登录用户改自己的密码。**不是**「忘记密码重置」——重置需要邮箱验证码，
        那是另一个流程，契约的 53 个端点里没有对应端点。
      required:
        - oldPassword
        - newPassword
        - confirmPassword
      properties:
        oldPassword:
          type: string
          minLength: 6
          maxLength: 100
        newPassword:
          type: string
          minLength: 6
          maxLength: 100
          description: 必须含大小写字母和数字（与注册时同一套规则）
        confirmPassword:
          type: string
          minLength: 6
          maxLength: 100
          description: 必须与 newPassword 相同
