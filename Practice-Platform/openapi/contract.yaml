openapi: 3.1.0
info:
  title: 在线书法练习平台 API 契约
  version: 1.0.0
  description: |
    契约单一真相源。

    规则：新增端点先改本文件，再写后端实现，最后接前端。
    `scripts/check-contract.mjs` 会把本文件与前端调用点、后端 Controller 三方比对。

    响应格式（见 design doc §3.1 规则三）：
    - 成功·单资源：裸资源 JSON
    - 成功·列表：`{content,page,size,total,totalPages}`
    - 成功·无内容：204
    - 失败：`{code,message}` + 语义化 HTTP 状态码
  contact:
    name: contract-owner
servers:
  - url: http://localhost:8083
    description: 本地开发后端
tags:
  - name: auth
    description: 认证与令牌
  - name: users
    description: 用户资料
  - name: works
    description: 书法作品
  - name: copybooks
    description: 字帖与练习记录
  - name: comments
    description: 作品评论
  - name: discussions
    description: 社区讨论与回复
  - name: file-reviews
    description: 管理端作品审核
  - name: stats
    description: 统计概览
x-contract-rules:
  boolean-naming: >
    DTO 里声明成 `private boolean isXxx;` 的字段，Lombok 生成的是 `isXxx()`，
    Jackson 会把属性名剥成 `xxx`（`isFeatured` -> `featured`），而实体上手写的
    `getIsFeatured()` 得到的是 `isFeatured`。契约统一按 **DTO 字段名** 书写
    （`isFeatured`、`isLikedByCurrentUser`、`isVerified`、`isTwoFactorEnabled`），
    实现时必须用 `@JsonProperty` 或调整命名把 JSON 对齐，否则线上 JSON 与契约对不上。
  nullable: >
    契约不标 nullable。字段是否可空，看对应 DTO 上的校验注解与 Java 类型
    （基本类型必有值，引用类型可为 null）。
  list-envelope: >
    列表端点一律返回 `{content,page,size,total,totalPages}`。
    `content` 是元素数组，`page` 从 0 开始。不得再包 `success` / `data` 外壳。
security:
  - bearerAuth: []
paths:
  /api/frontend/auth/register:
    post:
      operationId: frontendAuthRegister
      summary: 前端用户注册
      description: 注册后直接返回令牌；`verificationRequired` 为真表示还需要邮箱验证码。
      tags:
        - auth
      security: []
      x-frontend-call: authAPI.register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/frontend/auth/login:
    post:
      operationId: frontendAuthLogin
      summary: 前端用户登录
      tags:
        - auth
      security: []
      x-frontend-call: authAPI.login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
  /api/backend/auth/login:
    post:
      operationId: backendAuthLogin
      summary: 管理员登录
      tags:
        - auth
      security: []
      x-frontend-call: authAPI.adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: 登录成功。形状与前端用户登录一致（`user` 是嵌套对象，不是 data 信封）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/frontend/auth/profile:
    get:
      operationId: frontendAuthProfile
      summary: 前端用户当前资料
      tags:
        - auth
      x-frontend-call: authAPI.getProfile
      responses:
        '200':
          description: 当前用户资料（**裸资源**，不是 `{user:...}` 包装）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/backend/auth/profile:
    get:
      operationId: backendAuthProfile
      summary: 管理员当前资料
      tags:
        - auth
      x-frontend-call: authAPI.getProfile
      responses:
        '200':
          description: 当前管理员资料（**裸资源**）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/frontend/auth/refresh:
    post:
      operationId: frontendAuthRefresh
      summary: 前端用户刷新令牌
      tags:
        - auth
      security: []
      x-frontend-call: authAPI.refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/backend/auth/refresh:
    post:
      operationId: backendAuthRefresh
      summary: 管理员刷新令牌
      tags:
        - auth
      security: []
      x-frontend-call: authAPI.refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/frontend/auth/logout:
    post:
      operationId: frontendAuthLogout
      summary: 前端用户登出
      description: 把 refresh token 加入 Redis 黑名单，使其立即失效。
      tags:
        - auth
      x-frontend-call: authAPI.logout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: 已登出
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/backend/auth/logout:
    post:
      operationId: backendAuthLogout
      summary: 管理员登出
      tags:
        - auth
      x-frontend-call: authAPI.logout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: 已登出
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/verification-code:
    post:
      operationId: authSendVerificationCode
      summary: 发送邮箱验证码
      tags:
        - auth
      security: []
      x-frontend-call: authAPI.sendVerificationCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationCodeRequest'
      responses:
        '200':
          description: 已发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationCodeSent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/users/profile:
    put:
      operationId: userUpdateProfile
      summary: 更新当前用户资料
      tags:
        - users
      x-frontend-call: userAPI.updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrontendUserUpdate'
      responses:
        '200':
          description: 更新后的资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrontendUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/users/avatar:
    post:
      operationId: userUploadAvatar
      summary: 上传用户头像
      tags:
        - users
      x-frontend-call: userAPI.uploadAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AvatarUpload'
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/users/password:
    put:
      operationId: userChangePassword
      summary: 修改密码
      tags:
        - users
      x-frontend-call: userAPI.changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: 已修改
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/users/{userId}:
    get:
      operationId: userGetById
      summary: 获取指定用户资料
      tags:
        - users
      x-frontend-call: userAPI.getUserInfo
      parameters:
        - name: userId
          in: path
          required: true
          description: 用户 ID
          schema:
            type: string
      responses:
        '200':
          description: 用户资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrontendUser'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/works:
    post:
      operationId: workCreate
      summary: 发布作品
      tags:
        - works
      x-frontend-call: worksAPI.createWork
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkCreateForm'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Work'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      operationId: workList
      summary: 作品列表
      tags:
        - works
      security: []
      x-frontend-call: worksAPI.getWorks
      parameters:
        - name: page
          in: query
          required: false
          description: 页码，从 0 开始
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          description: 每页数量，上限 100
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 分页后的作品列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkPage'
  /api/works/user/{userId}:
    get:
      operationId: workListByUser
      summary: 某个用户的作品列表
      tags:
        - works
      x-frontend-call: worksAPI.getUserWorks
      parameters:
        - name: userId
          in: path
          required: true
          description: 用户 ID
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 分页后的作品列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkPage'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/works/{workId}:
    get:
      operationId: workGetById
      summary: 作品详情
      tags:
        - works
      x-frontend-call: worksAPI.getWorkDetail
      parameters:
        - name: workId
          in: path
          required: true
          description: 作品 ID
          schema:
            type: string
      responses:
        '200':
          description: 作品详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Work'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: workUpdate
      summary: 更新作品
      tags:
        - works
      x-frontend-call: worksAPI.updateWork
      parameters:
        - name: workId
          in: path
          required: true
          description: 作品 ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkUpdate'
      responses:
        '200':
          description: 更新后的作品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Work'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: workDelete
      summary: 删除作品
      tags:
        - works
      x-frontend-call: worksAPI.deleteWork
      parameters:
        - name: workId
          in: path
          required: true
          description: 作品 ID
          schema:
            type: string
      responses:
        '204':
          description: 已删除
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/works/{workId}/image:
    post:
      operationId: workUpdateImage
      summary: 更新作品图片
      tags:
        - works
      x-frontend-call: worksAPI.updateWorkImage
      parameters:
        - name: workId
          in: path
          required: true
          description: 作品 ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkImageForm'
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/copybooks:
    get:
      operationId: copybookList
      summary: 字帖列表
      tags:
        - copybooks
      security: []
      x-frontend-call: copybookAPI.getCopybooks
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: difficulty
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 分页后的字帖列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopybookPage'
  /api/copybooks/popular:
    get:
      operationId: copybookPopular
      summary: 热门字帖
      description: 与 `GET /api/copybooks/{copybookId}` 同级；Spring 字面量路径优先于模板路径，契约测试须断言二者互不吞掉。
      tags:
        - copybooks
      security: []
      x-frontend-call: copybookAPI.getPopularCopybooks
      responses:
        '200':
          description: 热门字帖列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopybookPage'
  /api/copybooks/statistics/user:
    get:
      operationId: copybookUserStatistics
      summary: 当前用户的练习统计
      tags:
        - copybooks
      x-frontend-call: copybookAPI.getUserStatistics
      responses:
        '200':
          description: 练习统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeStatistics'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/copybooks/practice/history:
    get:
      operationId: copybookPracticeHistory
      summary: 当前用户的练习历史
      description: 新增端点，替换前端 store 里调用的幽灵方法 `copybookAPI.getPracticeHistory`。
      tags:
        - copybooks
      x-frontend-call: copybookAPI.getPracticeHistory
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 分页后的练习记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeRecordPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/copybooks/{copybookId}:
    get:
      operationId: copybookGetById
      summary: 字帖详情
      tags:
        - copybooks
      security: []
      x-frontend-call: copybookAPI.getCopybookDetail
      parameters:
        - name: copybookId
          in: path
          required: true
          description: 字帖 ID
          schema:
            type: string
      responses:
        '200':
          description: 字帖详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Copybook'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/copybooks/{copybookId}/practice:
    post:
      operationId: copybookRecordPractice
      summary: 记录一次练习
      description: api.js 里的方法是 `copybookAPI.recordPractice`；前端 store 调用的 `copybookAPI.addPracticeRecord` 是幽灵方法，P5 必须改成调用 recordPractice。
      tags:
        - copybooks
      x-frontend-call: copybookAPI.recordPractice
      parameters:
        - name: copybookId
          in: path
          required: true
          description: 字帖 ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PracticeRecordCreate'
      responses:
        '201':
          description: 记录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/community/comments:
    post:
      operationId: commentCreate
      summary: 发表评论
      tags:
        - comments
      x-frontend-call: communityAPI.createComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/community/comments/work/{workId}:
    get:
      operationId: commentListByWork
      summary: 某个作品的评论列表
      tags:
        - comments
      security: []
      x-frontend-call: communityAPI.getWorkComments
      parameters:
        - name: workId
          in: path
          required: true
          description: 作品 ID
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 分页后的评论列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/community/comments/user/{userId}:
    get:
      operationId: commentListByUser
      summary: 某个用户的评论历史
      tags:
        - comments
      x-frontend-call: communityAPI.getUserComments
      parameters:
        - name: userId
          in: path
          required: true
          description: 用户 ID
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 分页后的评论列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/community/comments/{commentId}:
    delete:
      operationId: commentDelete
      summary: 删除评论
      tags:
        - comments
      x-frontend-call: communityAPI.deleteComment
      parameters:
        - name: commentId
          in: path
          required: true
          description: 评论 ID
          schema:
            type: string
      responses:
        '204':
          description: 已删除
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/file-reviews:
    post:
      operationId: fileReviewCreate
      summary: 提交作品审核
      description: 需要 ADMIN 或 SUPER_ADMIN 角色。
      tags:
        - file-reviews
      x-frontend-call: fileReviewsAPI.createReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileReviewCreate'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileReview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
